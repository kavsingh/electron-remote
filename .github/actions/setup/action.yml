name: Setup
description: Setup and install dependencies

inputs:
  install_flags:
    description: pnpm install flags
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/setup@v3
      with:
        require-lockfile: true
        cache: true
        install: false

    - run: pnpm install --frozen-lockfile ${{ inputs.install_flags }}
      shell: bash
