minimumReleaseAge: 4320 # 3 days in minutes
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
blockExoticSubdeps: true
verifyDepsBeforeRun: prompt

packages:
  - apps/*
  - packages/*

savePrefix: ''

catalog:
  '@playwright/test': 1.64.0
  '@reduxjs/toolkit': 2.13.0
  '@tailwindcss/vite': 4.3.3
  '@tanstack/devtools-vite': 0.8.5
  '@tanstack/eslint-plugin-router': 1.162.0
  '@tanstack/react-devtools': 0.10.13
  '@tanstack/react-router': 1.170.42
  '@tanstack/react-router-devtools': 1.167.2
  '@tanstack/router-cli': 1.167.41
  '@tanstack/router-plugin': 1.168.43
  '@testing-library/dom': 10.4.2
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.7
  '@types/babel__core': 7.20.5
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.2
  '@vitest/coverage-v8': 5.0.4
  citty: 0.2.2
  electron: 44.7.0
  electron-log: 5.4.4
  eslint-plugin-better-tailwindcss: 4.9.0
  eslint-plugin-jest-dom: 5.10.1
  eslint-plugin-playwright: 2.12.1
  eslint-plugin-testing-library: 7.16.2
  jsdom: 30.1.2
  memfs: 4.80.0
  mutative: 2.0.0
  neverthrow: 8.2.0
  oxc-transform-react: 0.153.0
  oxfmt: 0.72.0
  oxlint: 1.87.0
  oxlint-tsgolint: 7.0.2004
  react: 19.3.0
  react-dom: 19.3.0
  react-redux: 9.3.0
  superjson: 2.2.6
  tailwind-merge: 3.7.0
  tailwind-variants: 3.3.1
  tailwindcss: 4.3.3
  terser: 5.51.2
  tsdown: 0.23.1
  vite: 8.3.4
  vite-plugin-bundle-obfuscator: 1.13.2
  vitest: 5.0.4
  wait-on: 9.5.1
  zod: 4.6.7
  zx: 8.8.5

trustPolicyExclude:
  - '@vercel/cli-config@0.2.7' # @TODO: remove this when possible
  - '@vercel/cli-exec@1.0.1' # @TODO: remove this when possible
  - '@vercel/oidc@3.8.8' # @TODO: remove this when possible

allowBuilds:
  electron-winstaller: true
  esbuild: true
  lefthook: true

permissions:
  '@tanstack/devtools-vite':
    skills: true
  '@tanstack/router-plugin':
    skills: true

skills:
  dirs:
    - .agents/skills